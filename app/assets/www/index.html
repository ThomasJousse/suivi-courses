<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suivi de courses</title>
<style>
:root{
  --bg:#F3F6F7;--surface:#fff;--surface-2:#F8FAFB;--ink:#15283A;--ink-2:#465A6B;--muted:#76879A;--line:#DCE3E8;--line-2:#EBF0F3;
  --band:#17324D;--band-ink:#fff;--band-muted:#A9BCCB;
  --accent:#147D92;--accent-strong:#0E6375;--accent-soft:#E2F0F3;
  --good:#2D7A4F;--good-soft:#E3F2E8;--warn:#A86A12;--warn-soft:#FBEFD9;--bad:#B0413A;--bad-soft:#F8E3E1;
  --mono:ui-monospace,"Roboto Mono",Menlo,monospace;--r:12px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1820;--surface:#15232D;--surface-2:#1A2A35;--ink:#E5EDF2;--ink-2:#AAB9C4;--muted:#7F909C;--line:#26394A;--line-2:#1F303C;
  --band:#0B2236;--band-ink:#F2F7FA;--band-muted:#8EA6B8;
  --accent:#3FB2C7;--accent-strong:#69C6D7;--accent-soft:#163A46;
  --good:#5BC08A;--good-soft:#173528;--warn:#E1A94C;--warn-soft:#3A2D16;--bad:#E77A70;--bad-soft:#3D1F1D;color-scheme:dark}}
:root[data-profile="dorian"]{--band:#5B2C3C}
@media (prefers-color-scheme:dark){:root[data-profile="dorian"]{--band:#3B1D28}}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2{margin:0;letter-spacing:-.01em}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}
.band{background:var(--band);color:var(--band-ink);padding-top:env(safe-area-inset-top,0px);transition:background .2s}
.band .wrap{padding-block:14px 16px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-size:22px;font-weight:700;margin-right:auto}
.sync{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--band-muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--band-muted);flex:none}
.dot.ok{background:#5BC08A}.dot.busy{background:#E1A94C;animation:p 1s infinite}.dot.err{background:#E77A70}
@keyframes p{50%{opacity:.3}}
.iconbtn{background:transparent;border:1px solid rgba(255,255,255,.3);color:var(--band-ink);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;font-size:19px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface);gap:2px}
.seg button{border:0;background:none;padding:7px 13px;border-radius:7px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg.prof{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28)}
.seg.prof button{color:var(--band-muted)}
.seg.prof button[aria-pressed="true"]{background:var(--band-ink);color:var(--band)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
main{padding-block:16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:14px 16px 0;flex-wrap:wrap}
.ph h2{font-size:17px;font-weight:700}
.pb{padding:12px 16px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:11px 14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;flex:1}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.add p{margin:0 0 10px;color:var(--ink-2);font-size:13.5px}
.period{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.nav .lbl{min-width:128px;text-align:center;font-weight:700;font-size:15.5px;text-transform:capitalize}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi.hero{grid-column:1/-1;background:var(--accent-soft);border-color:transparent}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:600}
.kpi.hero .v{font-size:30px}
.kpi .d{font-size:12.5px;color:var(--ink-2)}
.up{color:var(--bad)}.down{color:var(--good)}
.meter{height:8px;border-radius:5px;background:var(--line-2);overflow:hidden;margin:4px 0}
.meter i{display:block;height:100%;background:var(--good)}
.meter.warn i{background:var(--warn)}.meter.bad i{background:var(--bad)}
svg text{fill:var(--muted);font-size:11px;font-family:var(--mono)}
svg .grid{stroke:var(--line-2)}svg .base{stroke:var(--line)}
svg .bar{fill:var(--accent);opacity:.45}svg .bar.sel{opacity:1}
svg text.sel{fill:var(--ink);font-weight:700}svg text.vl{fill:var(--ink);font-weight:600}
svg .hit{fill:transparent}
.cats{display:flex;flex-direction:column;gap:4px}
.cat{display:grid;grid-template-columns:minmax(0,9.5em) 1fr auto;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:7px 6px;border-radius:8px}
.cat[aria-pressed="true"]{background:var(--accent-soft)}
.cat .n{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:10px;background:var(--line-2);border-radius:6px;overflow:hidden}
.fill{display:block;height:100%;background:var(--accent);border-radius:6px}
.cat .val{font-family:var(--mono);font-size:13px;text-align:right;white-space:nowrap}
.cat .pct{display:block;color:var(--muted);font-size:11px}
.filter{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.chip{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:20px;padding:3px 10px;font-size:12.5px;font-weight:600}
.trow{width:100%;display:grid;grid-template-columns:3.2em minmax(0,1fr) auto auto;align-items:center;gap:10px;border:0;border-top:1px solid var(--line-2);background:none;text-align:left;padding:11px 2px}
.trow:first-child{border-top:0}
.mag{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sub{font-size:12px;color:var(--muted)}
.amt{font-family:var(--mono);font-weight:600}
.chev{color:var(--muted);transition:transform .15s}
.trow[aria-expanded="true"] .chev{transform:rotate(90deg)}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.neutral{background:var(--line-2);color:var(--muted)}
.receipt{background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;margin:0 0 12px;padding:12px;font-family:var(--mono);font-size:12.5px}
.ln{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.ln .q{color:var(--muted);font-size:11.5px}
.ln.rm{color:var(--good);padding-left:10px}
.ln.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-weight:700}
.ln.hl{background:var(--accent-soft);border-radius:4px}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:15px}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;border-top:1px solid var(--line-2);padding:9px 2px}
.arow:first-child{border-top:0}
.arow .a{font-size:14px;font-weight:500}
.arow .p{font-family:var(--mono);text-align:right;font-weight:600;font-size:13.5px}
.empty{padding:16px 4px;color:var(--muted);text-align:center;font-size:14px}
.banner{border-radius:10px;padding:10px 12px;font-size:13.5px;background:var(--warn-soft);color:var(--warn)}
.tip{position:fixed;z-index:5;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:7px;font-size:12.5px;pointer-events:none}
</style>
</head>
<body>
<header class="band"><div class="wrap">
  <div class="top">
    <h1>Suivi de courses</h1>
    <button class="iconbtn" id="refresh" aria-label="Actualiser">⟳</button>
  </div>
  <div class="row" style="justify-content:space-between">
    <div class="seg prof" id="prof">
      <button data-p="thomas" aria-pressed="true">Thomas</button>
      <button data-p="dorian" aria-pressed="false">Dorian</button>
    </div>
    <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">Chargement…</span></div>
  </div>
</div></header>

<main class="wrap">
  <div id="update" class="panel" hidden style="display:flex;align-items:center;gap:10px;padding:12px 14px"></div>
  <div id="banner" class="banner" hidden></div>

  <section class="panel add"><div class="pb">
    <p>Dépose le ticket (photo ou PDF) dans ton dossier Drive, puis lance l'intégration avec Claude. L'appli se met à jour toute seule.</p>
    <div class="row">
      <button class="btn" id="openDrive">📁 Déposer un ticket</button>
      <button class="btn primary" id="openClaude">✦ Intégrer avec Claude</button>
    </div>
  </div></section>

  <div class="period">
    <div class="seg" id="mode">
      <button data-m="month" aria-pressed="true">Mois</button>
      <button data-m="year" aria-pressed="false">Année</button>
    </div>
    <div class="nav">
      <button id="prev" aria-label="Précédent">‹</button>
      <span class="lbl" id="plbl"></span>
      <button id="next" aria-label="Suivant">›</button>
    </div>
  </div>

  <section class="kpis" id="kpis"></section>

  <section class="panel">
    <div class="ph"><h2>Dépenses par mois</h2><span class="sub" id="mSub"></span></div>
    <div class="pb" id="chart"></div>
  </section>

  <section class="panel">
    <div class="ph"><h2>Catégories</h2>
      <div class="seg" id="catBy"><button data-b="eur" aria-pressed="true">€</button><button data-b="qty" aria-pressed="false">Articles</button></div>
    </div>
    <div class="pb"><div class="cats" id="cats"></div></div>
  </section>

  <section class="panel">
    <div class="ph"><h2>Tickets</h2><span class="sub" id="tSub"></span></div>
    <div class="pb"><div id="filt"></div><div id="tlist"></div></div>
  </section>

  <section class="panel">
    <div class="ph"><h2>Chercher un article</h2><span class="sub">tous les tickets</span></div>
    <div class="pb">
      <input class="search" id="q" type="search" placeholder="ex. beurre, lait, café…" autocomplete="off">
      <div id="alist" style="margin-top:8px"></div>
    </div>
  </section>
  <button id="ver" class="sub" style="background:none;border:0;align-self:center"></button>
</main>
<div class="tip" id="tip" hidden></div>

<script src="config.js"></script>
<script>
"use strict";
const CFG = window.APP_CONFIG || {};
const PROFILES = { thomas: { name: "Thomas" }, dorian: { name: "Dorian" } };
const CATS = ["Fruits et légumes","Viandes","Poissons","Produits laitiers","Boulangerie","Épicerie","Surgelés","Boissons","Plats bébé","Entretien et hygiène","Autres achats"];
const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MSHORT = ["J","F","M","A","M","J","J","A","S","O","N","D"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = (n) => Math.round(n * 100) / 100;
const fmtNum = (n, d = 2) => (n ?? 0).toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtEUR = (n) => fmtNum(n) + " €";
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

const now = new Date();
const state = {
  profile: store.get("profile") || "thomas",
  data: null, loading: false,
  view: { mode: "month", y: now.getFullYear(), m: now.getMonth() + 1 },
  catBy: "eur", cat: null, open: null, q: "",
};

/* ---------- Network: native bridge in the APK, fetch in a browser ---------- */
const pending = {};
let seq = 0;
window.__nativeCb = (id, ok, body) => { const p = pending[id]; if (!p) return; delete pending[id]; ok ? p.res(body) : p.rej(new Error(body)); };
function httpGet(url) {
  if (window.Native && Native.get) return new Promise((res, rej) => { const id = "r" + (++seq); pending[id] = { res, rej }; Native.get(url, id); });
  return fetch(url).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); });
}
function openUrl(url) { if (window.Native && Native.open) Native.open(url); else window.open(url, "_blank"); }

/* ---------- Value parsing ---------- */
const num = (s) => { if (s == null) return 0; const t = String(s).replace(/[^\d,.\-]/g, "").replace(",", "."); const n = parseFloat(t); return isNaN(n) ? 0 : n; };
const dnum = (s) => { const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(s || "").trim()); return m ? { y: +m[3], m: +m[2], d: +m[1], k: +m[3] * 10000 + +m[2] * 100 + +m[1], s: `${m[1].padStart(2,"0")}/${m[2].padStart(2,"0")}/${m[3]}` } : null; };

async function load() {
  const prof = state.profile, p = PROFILES[prof];
  state.loading = true; setSync("busy", "Actualisation…");
  try {
    if (!CFG.api || !CFG.key) throw new Error("config");
    const txt = await httpGet(`${CFG.api}?k=${encodeURIComponent(CFG.key)}&p=${prof}&t=${Date.now()}`);
    let raw; try { raw = JSON.parse(txt); } catch { throw new Error("réponse illisible"); }
    if (raw.error) throw new Error(raw.error);
    const data = parseAll(raw);
    store.set("data_" + prof, data);
    if (prof === state.profile) { state.data = data; $("banner").hidden = true; }
    setSync("ok", "À jour · " + new Date(data.at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }));
  } catch (e) {
    const cached = store.get("data_" + prof);
    if (cached && !state.data) state.data = cached;
    setSync("err", state.data ? "Hors ligne · données du " + new Date(state.data.at).toLocaleDateString("fr-FR") : "Erreur");
    const b = $("banner");
    b.textContent = e.message === "config" ? "Appli compilée sans adresse d'API : relance la compilation avec le secret APP_SECRETS."
      : e.message === "forbidden" ? "Clé refusée par le script Google : la clé de l'appli et celle du script ne correspondent pas."
      : e.message === "tool_error" ? `Le script n'arrive pas à lire le Sheet de ${p.name}.`
      : "Impossible de joindre Google. Vérifie ta connexion puis appuie sur ⟳.";
    b.hidden = false;
  }
  state.loading = false; render();
}
function parseAll(raw) {
  const T = (raw.tickets || []).slice(4), A = (raw.articles || []).slice(4), S = raw.suivi || [];
  const tickets = T.filter(r => (r[4] || "").trim()).map(r => ({
    suivi: dnum(r[0]), magasin: r[1], total: num(r[2]), rem: num(r[3]), id: r[4].trim(), paiement: r[5] || "", achat: dnum(r[7]),
  })).filter(t => t.suivi);
  const articles = A.filter(r => (r[1] || "").trim() && (r[2] || "").trim()).map(r => ({
    achat: dnum(r[0]), id: r[1].trim(), article: r[2], cat: r[3] || "Sans catégorie", qty: num(r[4]) || 1, unit: (r[5] || "").trim(), pu: num(r[6]),
    brut: num(r[7]), rem: num(r[8]), net: num(r[9]), obs: r[10] || "", kg: num(r[11]), pkg: num(r[13]), magasin: r[16] || "",
  }));
  let budgetYear = null; const budgets = Array(12).fill(null);
  if (S.length > 15) { budgetYear = parseInt(S[1]?.[1]) || null; for (let i = 0; i < 12; i++) { const v = S[4 + i]?.[4]; budgets[i] = v && num(v) > 0 ? num(v) : null; } }
  return { at: raw.at || Date.now(), inbox: raw.inbox || "", inboxName: raw.inboxName || "", sheetName: raw.sheetName || "", tickets, articles, budgetYear, budgets };
}

/* ---------- Mise à jour depuis les Releases GitHub ---------- */
const UP_LS = "suivi-courses-update";
const cmpV = (a, b) => { const pa = String(a).replace(/^v/, "").split(".").map(Number), pb = String(b).replace(/^v/, "").split(".").map(Number);
  for (let i = 0; i < 3; i++) { const d = (pa[i] || 0) - (pb[i] || 0); if (d) return d > 0 ? 1 : -1; } return 0; };
async function checkUpdate(force) {
  if (!CFG.repo || !CFG.version) return;
  const memo = store.get(UP_LS) || {};
  if (!force && memo.checked && Date.now() - memo.checked < 3 * 3600000 && !memo.pending) return;
  try {
    const rel = JSON.parse(await httpGet(`https://api.github.com/repos/${CFG.repo}/releases/latest`));
    const asset = (rel.assets || []).find(a => /\.apk$/i.test(a.name));
    memo.checked = Date.now();
    if (asset && cmpV(rel.tag_name, CFG.version) > 0) {
      memo.pending = rel.tag_name;
      const snoozed = memo.skip === rel.tag_name && Date.now() - (memo.at || 0) < 24 * 3600000;
      if (!snoozed || force) showUpdate(rel.tag_name, asset.browser_download_url);
    } else memo.pending = null;
    store.set(UP_LS, memo);
  } catch {}
}
function showUpdate(v, url) {
  const box = $("update");
  box.innerHTML = `<span><b>Nouvelle version ${esc(v.replace(/^v/, ""))}</b><br><span class="sub">Télécharge puis ouvre le fichier pour installer.</span></span>
    <button class="btn primary" data-up="go" style="flex:none">Installer</button><button class="btn" data-up="later" style="flex:none" aria-label="Plus tard">✕</button>`;
  box.hidden = false;
  box.onclick = e => { const b = e.target.closest("[data-up]"); if (!b) return;
    if (b.dataset.up === "go") openUrl(url); else { const m = store.get(UP_LS) || {}; m.skip = v; m.at = Date.now(); store.set(UP_LS, m); }
    box.hidden = true; };
}

/* ---------- Period helpers ---------- */
const inPeriod = (d, v = state.view) => d && d.y === v.y && (v.mode === "year" || d.m === v.m);
const periodLabel = (v = state.view) => v.mode === "year" ? String(v.y) : `${MONTHS[v.m - 1]} ${v.y}`;
function prevView(v = state.view) { return v.mode === "year" ? { ...v, y: v.y - 1 } : v.m === 1 ? { ...v, y: v.y - 1, m: 12 } : { ...v, m: v.m - 1 }; }
function nextView(v = state.view) { return v.mode === "year" ? { ...v, y: v.y + 1 } : v.m === 12 ? { ...v, y: v.y + 1, m: 1 } : { ...v, m: v.m + 1 }; }
function sumPeriod(v) { let s = 0, n = 0, rem = 0; for (const t of state.data.tickets) if (inPeriod(t.suivi, v)) { s += t.total; n++; rem += t.rem; } return { s: r2(s), n, rem: r2(rem) }; }

/* ---------- Render ---------- */
function setSync(c, t) { $("dot").className = "dot " + c; $("syncTxt").textContent = t; }
function render() {
  document.documentElement.dataset.profile = state.profile;
  if (window.Native && Native.setBar) Native.setBar(getComputedStyle(document.documentElement).getPropertyValue("--band").trim());
  for (const b of $("prof").children) b.setAttribute("aria-pressed", b.dataset.p === state.profile);
  for (const b of $("mode").children) b.setAttribute("aria-pressed", b.dataset.m === state.view.mode);
  for (const b of $("catBy").children) b.setAttribute("aria-pressed", b.dataset.b === state.catBy);
  $("plbl").textContent = periodLabel();
  if (!state.data) { $("kpis").innerHTML = ""; $("chart").innerHTML = `<div class="empty">${state.loading ? "Chargement…" : "Aucune donnée."}</div>`; $("cats").innerHTML = ""; $("tlist").innerHTML = ""; $("alist").innerHTML = ""; return; }
  renderKpis(); renderChart(); renderCats(); renderTickets(); renderSearch();
}
function renderKpis() {
  const cur = sumPeriod(state.view), prv = sumPeriod(prevView());
  const avg = cur.n ? cur.s / cur.n : 0;
  let delta = "";
  if (prv.s > 0) { const d = (cur.s - prv.s) / prv.s * 100; delta = `<span class="d"><span class="${d > 0 ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ${fmtNum(Math.abs(d), 0)} %</span> vs ${esc(periodLabel(prevView()))}</span>`; }
  const ids = new Set(state.data.tickets.filter(t => inPeriod(t.suivi)).map(t => t.id));
  const nArt = state.data.articles.filter(a => ids.has(a.id)).length;
  let budget = "";
  const D = state.data;
  if (state.view.mode === "month" && D.budgetYear === state.view.y && D.budgets[state.view.m - 1]) {
    const b = D.budgets[state.view.m - 1], ratio = cur.s / b;
    budget = `<div class="kpi" style="grid-column:1/-1"><span class="l">Budget du mois</span><span class="v">${fmtEUR(r2(b - cur.s))}</span><span class="d">restant</span>
      <div class="meter ${ratio > 1 ? "bad" : ratio > .85 ? "warn" : ""}"><i style="width:${Math.min(100, ratio * 100).toFixed(1)}%"></i></div>
      <span class="d">${Math.round(ratio * 100)} % de ${fmtEUR(b)}</span></div>`;
  }
  $("kpis").innerHTML = `
    <div class="kpi hero"><span class="l">Total dépensé · ${esc(periodLabel())}</span><span class="v">${fmtEUR(cur.s)}</span>${delta}</div>
    <div class="kpi"><span class="l">Tickets</span><span class="v">${cur.n}</span><span class="d">${nArt} lignes d'articles</span></div>
    <div class="kpi"><span class="l">Panier moyen</span><span class="v">${fmtEUR(avg)}</span><span class="d">par ticket</span></div>
    <div class="kpi" style="grid-column:1/-1"><span class="l">Remises obtenues</span><span class="v">${fmtEUR(cur.rem)}</span><span class="d">${cur.s > 0 ? fmtNum(cur.rem / (cur.s + cur.rem) * 100, 1) + " % du brut" : "—"}</span></div>
    ${budget}`;
}
function niceMax(v) { if (v <= 0) return 100; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function renderChart() {
  const y = state.view.y, totals = Array(12).fill(0), counts = Array(12).fill(0);
  for (const t of state.data.tickets) if (t.suivi.y === y) { totals[t.suivi.m - 1] += t.total; counts[t.suivi.m - 1]++; }
  $("mSub").textContent = `${y} · ${fmtEUR(r2(totals.reduce((a, b) => a + b, 0)))}`;
  const W = 360, H = 190, L = 40, R = 4, T = 18, B = 22, iw = W - L - R, ih = H - T - B;
  const max = niceMax(Math.max(...totals)), band = iw / 12, bw = band * .62;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Dépenses par mois ${y}">`;
  for (let i = 0; i <= 4; i++) { const yy = T + ih - ih * i / 4; s += `<line class="${i ? "grid" : "base"}" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 5}" y="${yy + 4}" text-anchor="end">${fmtNum(max * i / 4, 0)}</text>`; }
  totals.forEach((v, i) => {
    const x = L + band * i + (band - bw) / 2, h = ih * v / max, yy = T + ih - h, sel = state.view.mode === "month" && state.view.m === i + 1;
    s += `<rect class="hit" x="${L + band * i}" y="0" width="${band}" height="${H}" data-m="${i + 1}" data-v="${v}" data-n="${counts[i]}"/>`;
    if (h > 0) s += `<rect class="bar ${sel ? "sel" : ""}" x="${x}" y="${yy}" width="${bw}" height="${h}" rx="3" pointer-events="none"/>`;
    if (sel && v > 0) s += `<text class="vl" x="${x + bw / 2}" y="${yy - 5}" text-anchor="middle">${fmtNum(v, 0)} €</text>`;
    s += `<text class="${sel ? "sel" : ""}" x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${MSHORT[i]}</text>`;
  });
  $("chart").innerHTML = s + "</svg>";
}
const artCount = (a) => a.unit === "kg" ? 1 : Math.max(1, Math.round(a.qty || 1));
function renderCats() {
  const ids = new Set(state.data.tickets.filter(t => inPeriod(t.suivi)).map(t => t.id));
  const m = new Map(CATS.map(c => [c, { eur: 0, qty: 0 }]));
  for (const a of state.data.articles) if (ids.has(a.id)) { const e = m.get(a.cat) || { eur: 0, qty: 0 }; e.eur += a.net; e.qty += artCount(a); m.set(a.cat, e); }
  const by = state.catBy;
  const rows = [...m.entries()].map(([c, e]) => ({ c, eur: r2(e.eur), qty: e.qty })).filter(r => r.eur || r.qty).sort((a, b) => b[by] - a[by]);
  if (!rows.length) { $("cats").innerHTML = `<div class="empty">Aucun article sur ${esc(periodLabel())}.</div>`; return; }
  const max = Math.max(...rows.map(r => r[by]), .01);
  $("cats").innerHTML = rows.map(r => `<button class="cat" data-cat="${esc(r.c)}" aria-pressed="${state.cat === r.c}">
    <span class="n">${esc(r.c)}</span><span class="track"><span class="fill" style="width:${(r[by] / max * 100).toFixed(1)}%"></span></span>
    <span class="val">${by === "eur" ? fmtEUR(r.eur) : r.qty + " art."}<span class="pct">${by === "eur" ? r.qty + " art." : fmtEUR(r.eur)}</span></span></button>`).join("");
}
function renderTickets() {
  const D = state.data;
  let list = D.tickets.filter(t => inPeriod(t.suivi));
  if (state.cat) { const ok = new Set(D.articles.filter(a => a.cat === state.cat).map(a => a.id)); list = list.filter(t => ok.has(t.id)); }
  list.sort((a, b) => b.suivi.k - a.suivi.k);
  $("filt").innerHTML = state.cat ? `<div class="filter">Tickets avec « ${esc(state.cat)} » <button class="chip" id="clearCat">✕ retirer</button></div>` : "";
  $("tSub").textContent = list.length ? `${list.length} · ${periodLabel()}` : "";
  if (!list.length) { $("tlist").innerHTML = `<div class="empty">Aucun ticket sur ${esc(periodLabel())}.</div>`; return; }
  $("tlist").innerHTML = list.map(t => {
    const arts = D.articles.filter(a => a.id === t.id), sumNet = r2(arts.reduce((s, a) => s + a.net, 0)), gap = arts.length ? r2(sumNet - t.total) : null;
    const status = gap == null ? `<span class="pill neutral">sans détail</span>` : Math.abs(gap) < .005 ? "" : `<span class="pill warn">écart ${fmtEUR(gap)}</span>`;
    const open = state.open === t.id, diff = t.achat && t.achat.k !== t.suivi.k;
    let h = `<button class="trow" data-tid="${esc(t.id)}" aria-expanded="${open}">
      <span class="num" style="font-size:13px">${t.suivi.s.slice(0, 5)}</span>
      <span style="min-width:0"><span class="mag">${esc(t.magasin || "Magasin ?")}</span><span class="sub">${arts.length} art.${t.paiement ? " · " + esc(t.paiement) : ""}${diff ? " · acheté le " + t.achat.s : ""} ${status}</span></span>
      <span class="amt">${fmtEUR(t.total)}</span><span class="chev">›</span></button>`;
    if (open) h += receipt(t, arts);
    return h;
  }).join("");
}
function receipt(t, arts) {
  const lines = arts.map(a => {
    const q = a.unit === "kg" ? `${fmtNum(a.qty, 3)} kg × ${fmtNum(a.pu)} €/kg` : a.qty !== 1 ? `${fmtNum(a.qty, 0)} × ${fmtNum(a.pu)} €` : "";
    return `<div class="ln ${state.cat && a.cat === state.cat ? "hl" : ""}"><span>${esc(a.article)}${q ? `<br><span class="q">${q}</span>` : ""}</span><span>${fmtNum(a.brut)}</span></div>` +
      (a.rem ? `<div class="ln rm"><span>${esc((a.obs || "Remise").split(";")[0].slice(0, 40))}</span><span>−${fmtNum(a.rem)}</span></div>` : "");
  }).join("");
  return `<div class="receipt">${lines || `<div class="muted">Pas de détail d'articles.</div>`}
    ${t.rem ? `<div class="ln rm"><span>Total remises</span><span>−${fmtNum(t.rem)}</span></div>` : ""}
    <div class="ln tot"><span>PAYÉ</span><span>${fmtEUR(t.total)}</span></div>
    <div class="ln q"><span>${esc(t.id)}</span><span>${t.achat ? t.achat.s : ""}</span></div></div>`;
}
const norm = (s) => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function renderSearch() {
  const q = norm(state.q.trim());
  if (q.length < 2) { $("alist").innerHTML = ""; return; }
  const words = q.split(/\s+/);
  const res = state.data.articles.filter(a => { const n = norm(a.article + " " + a.cat); return words.every(w => n.includes(w)); })
    .sort((a, b) => (b.achat?.k || 0) - (a.achat?.k || 0)).slice(0, 60);
  if (!res.length) { $("alist").innerHTML = `<div class="empty">Rien trouvé pour « ${esc(state.q)} ».</div>`; return; }
  $("alist").innerHTML = res.map(a => {
    const unitP = a.unit === "kg" ? `${fmtNum(a.pu)} €/kg` : a.pkg ? `${fmtNum(a.pkg)} €/kg` : a.qty > 1 ? `${fmtNum(a.net / a.qty)} €/u` : "";
    return `<div class="arow"><span class="a">${esc(a.article)}</span><span class="p">${fmtEUR(a.net)}</span>
      <span class="sub">${a.achat ? a.achat.s : ""} · ${esc(a.magasin)}${a.qty !== 1 ? ` · ${a.unit === "kg" ? fmtNum(a.qty, 3) + " kg" : fmtNum(a.qty, 0) + " ×"}` : ""}</span><span class="sub" style="text-align:right">${unitP}</span></div>`;
  }).join("") + (res.length === 60 ? `<div class="empty">60 premiers résultats.</div>` : "");
}

/* ---------- Events ---------- */
$("prof").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.dataset.p === state.profile) return;
  state.profile = b.dataset.p; store.set("profile", state.profile);
  state.data = store.get("data_" + state.profile); state.cat = null; state.open = null; $("banner").hidden = true;
  render(); load();
});
$("mode").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.view.mode = b.dataset.m; render(); });
$("prev").onclick = () => { state.view = prevView(); render(); };
$("next").onclick = () => { state.view = nextView(); render(); };
$("catBy").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.catBy = b.dataset.b; render(); });
$("cats").addEventListener("click", e => { const b = e.target.closest(".cat"); if (!b) return; state.cat = state.cat === b.dataset.cat ? null : b.dataset.cat; render(); });
$("filt").addEventListener("click", e => { if (e.target.id === "clearCat") { state.cat = null; render(); } });
$("tlist").addEventListener("click", e => { const b = e.target.closest(".trow"); if (!b) return; state.open = state.open === b.dataset.tid ? null : b.dataset.tid; renderTickets(); });
$("chart").addEventListener("click", e => {
  const r = e.target.closest(".hit"); if (!r) return;
  state.view.mode = "month"; state.view.m = +r.dataset.m; render();
  const tip = $("tip"); tip.textContent = `${MONTHS[r.dataset.m - 1]} : ${fmtEUR(+r.dataset.v)} · ${r.dataset.n} ticket(s)`;
  tip.style.left = Math.min(e.clientX, innerWidth - 200) + "px"; tip.style.top = (e.clientY - 40) + "px"; tip.hidden = false;
  clearTimeout(window.__tt); window.__tt = setTimeout(() => tip.hidden = true, 1800);
});
$("q").addEventListener("input", e => { state.q = e.target.value; if (state.data) renderSearch(); });
$("refresh").onclick = () => { if (!state.loading) load(); };
$("openDrive").onclick = () => { const id = state.data && state.data.inbox; openUrl(id ? "https://drive.google.com/drive/folders/" + id : "https://drive.google.com/drive/my-drive"); };
$("openClaude").onclick = () => {
  const p = PROFILES[state.profile], d = state.data || {};
  const prompt = `Utilise le skill ajout-ticket : intègre tous les tickets du dossier Drive « ${d.inboxName || "Tickets à intégrer " + p.name} » dans le Sheet « ${d.sheetName || "Suivi de courses"} » (profil ${p.name}), puis range-les dans « Tickets intégrés ».`;
  openUrl("https://claude.ai/new?q=" + encodeURIComponent(prompt));
};
document.addEventListener("visibilitychange", () => { if (!document.hidden && state.data && Date.now() - state.data.at > 60000 && !state.loading) load(); });

state.data = store.get("data_" + state.profile);
if (state.data) setSync("", "Données du " + new Date(state.data.at).toLocaleDateString("fr-FR"));
render(); load();
setTimeout(() => checkUpdate(false), 2500);
$("ver").textContent = CFG.version ? "v" + CFG.version : "";
$("ver").onclick = () => checkUpdate(true);
</script>
</body>
